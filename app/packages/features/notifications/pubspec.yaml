name: notifications
description: In-app notifications (likes, comments, mentions, follows, live broadcasts), the unread badge and the live alert sound.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  intl: ^0.20.2
  audioplayers: ^6.7.1
  core:
  design_system:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/live_alert.wav
