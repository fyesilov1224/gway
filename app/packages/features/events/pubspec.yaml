name: events
description: Group events (organizasyon) with a waitlist and fee information, and polls.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  intl: ^0.20.2
  core:
  design_system:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.3
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    # Province outlines (Natural Earth, public domain), for the exploration map.
    - assets/tr_provinces.json
