name: games
description: Games, starting with chess between people and groups (docs/ARCHITECTURE.md §3i).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  intl: ^0.20.2
  audioplayers: ^6.7.1
  chess: ^0.8.1
  core:
  country_flags: ^4.1.2
  design_system:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  jovial_svg: ^1.1.25
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/pieces/classic/
    - assets/pieces/celtic/
    - assets/pieces/spatial/
    - assets/pieces/fantasy/
    - assets/pieces/chessnut/
    - assets/pieces/rhosgfx/
    - assets/pieces/licenses/
    - assets/sounds/
