name: grupx_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/social_app
  - apps/admin_panel
  - packages/core
  - packages/design_system
  - packages/features/billing
  - packages/features/feed
  - packages/features/groups
  - packages/features/identity
  - packages/features/notifications
  - packages/features/profile
  - packages/features/support
  - packages/features/events
  - packages/features/live
  - packages/features/messaging
  - packages/features/moderation
  - packages/features/admin

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.9.0

melos:
  scripts:
    analyze:
      run: flutter analyze --fatal-infos
      description: Tüm workspace için statik analiz.
    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Test klasörü olan her pakette testleri çalıştırır.
