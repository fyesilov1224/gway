<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Start the large downloads while flutter_bootstrap.js loads, instead of after it (docs/DEPLOY.md, Web hızı). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GWAY — tüm grupların tek adresi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GWAY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GWAY</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; font-weight: 700; font-display: swap;
      src: url("assets/packages/design_system/fonts/PlusJakartaSans-Bold.ttf") format("truetype"); }
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #gw-preloader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; background: #FFFFFF; transition: opacity .25s ease; }
    #gw-preloader svg { animation: gw-breathe 1.6s ease-in-out infinite; }
    #gw-preloader .gw-name { font: 700 28px/1 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.5px; color: #1F2033; }
    #gw-preloader .gw-name b { color: #6E56CF; }
    #gw-preloader .gw-caption { font: 700 12px/1 "Plus Jakarta Sans", system-ui, sans-serif; color: #6E56CF; background: #F3F0FF;
      padding: 4px 8px; border-radius: 8px; }
    @keyframes gw-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { #gw-preloader svg { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="gw-preloader" role="progressbar" aria-label="GWAY yükleniyor"><svg viewBox="0 0 120 120" width="64" height="64" aria-hidden="true"><path d="M100 60 A40 40 0 1 1 73.68 22.41" fill="none" stroke="#6E56CF" stroke-width="16" stroke-linecap="round"/><path d="M62 60 H100" stroke="#2F6FE0" stroke-width="16" stroke-linecap="round"/><circle cx="92" cy="35" r="11" fill="#2F6FE0"/></svg><div class="gw-name">G<b>WAY</b></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('gw-preloader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
