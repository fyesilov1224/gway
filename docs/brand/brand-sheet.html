<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWAY Logo</title>
<style>
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 700; src: url("../../app/packages/design_system/fonts/PlusJakartaSans-Bold.ttf"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; src: url("../../app/packages/design_system/fonts/PlusJakartaSans-Regular.ttf"); }
  :root { --bg: #FAFAFD; --card: #FFFFFF; --line: #ECECF2; --text: #1F2033; --muted: #5C5F77; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.5px; }
  p.lead { color: var(--muted); margin: 0 0 32px; font-weight: 400; max-width: 640px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; min-height: 260px; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wide { grid-column: 1 / -1; min-height: 220px; }
  .dark { background: #1F2033; border-color: #1F2033; }
  .purple { background: #6E56CF; border-color: #6E56CF; }
  figcaption { color: var(--muted); font-size: 13px; margin-top: 10px; text-align: center; font-weight: 400; }
  .word { font-weight: 700; letter-spacing: -1.5px; }
  .icons { display: flex; gap: 28px; align-items: end; flex-wrap: wrap; justify-content: center; }
  .icons img { display: block; border-radius: 22%; }
  .sw { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .sw div { width: 120px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); font-size: 12px; }
  .sw span { display: block; height: 72px; }
  .sw b { display: block; padding: 8px; background: #fff; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>GWAY logosu</h1>
  <p class="lead">Bir yol kıvrılıp G olur, bir üye o yola adım atar. Hem "GWAY"in G'si, hem topluluğuna giden yol.</p>

  <div class="grid">
    <figure style="margin:0" class="wide"><div class="card wide">
      <div style="display:flex;align-items:center;gap:28px">
        <img src="gway-mark.svg" width="120" height="120" alt="">
        <span class="word" style="font-size:96px">G<span style="color:#6E56CF">WAY</span></span>
      </div></div><figcaption>Yatay logo</figcaption></figure>

    <figure style="margin:0"><div class="card"><img src="gway-mark.svg" width="180" height="180" alt=""></div><figcaption>Sembol</figcaption></figure>
    <figure style="margin:0"><div class="card purple">
      <div style="display:flex;align-items:center;gap:16px">
        <svg viewBox="0 0 120 120" width="72" height="72"><path d="M100 60 A40 40 0 1 1 73.68 22.41" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/><path d="M62 60 H100" stroke="#C9DAFF" stroke-width="16" stroke-linecap="round"/><circle cx="92" cy="35" r="11" fill="#C9DAFF"/></svg>
        <span class="word" style="font-size:56px;color:#fff">G<span style="color:#C9DAFF">WAY</span></span>
      </div></div><figcaption>Mor zemin</figcaption></figure>
    <figure style="margin:0"><div class="card dark">
      <div style="display:flex;align-items:center;gap:16px">
        <svg viewBox="0 0 120 120" width="72" height="72"><path d="M100 60 A40 40 0 1 1 73.68 22.41" fill="none" stroke="#B5A6F5" stroke-width="16" stroke-linecap="round"/><path d="M62 60 H100" stroke="#8FB4FF" stroke-width="16" stroke-linecap="round"/><circle cx="92" cy="35" r="11" fill="#8FB4FF"/></svg>
        <span class="word" style="font-size:56px;color:#fff">G<span style="color:#B5A6F5">WAY</span></span>
      </div></div><figcaption>Koyu zemin</figcaption></figure>

    <figure style="margin:0" class="wide"><div class="card wide"><div class="icons">
      <img src="gway-app-icon.svg" width="160" height="160" alt="GWAY uygulama ikonu">
      <img src="gway-app-icon.svg" width="96" height="96" alt="">
      <img src="gway-app-icon.svg" width="48" height="48" alt="">
      <img src="gway-admin-icon.svg" width="160" height="160" alt="GWAY Yönetim ikonu">
      <img src="gway-admin-icon.svg" width="96" height="96" alt="">
      <img src="gway-admin-icon.svg" width="48" height="48" alt="">
    </div></div><figcaption>Uygulama ikonları — sosyal uygulama (mor) ve admin paneli (koyu)</figcaption></figure>

    <figure style="margin:0" class="wide"><div class="card wide"><div class="sw">
      <div><span style="background:#6E56CF"></span><b>Mor #6E56CF</b></div>
      <div><span style="background:#2F6FE0"></span><b>Mavi #2F6FE0</b></div>
      <div><span style="background:#1F2033"></span><b>Gece #1F2033</b></div>
      <div><span style="background:#C9DAFF"></span><b>Açık mavi #C9DAFF</b></div>
      <div><span style="background:#B5A6F5"></span><b>Yumuşak mor #B5A6F5</b></div>
      <div><span style="background:#8FB4FF"></span><b>Yumuşak mavi #8FB4FF</b></div>
    </div></div><figcaption>Logo renkleri</figcaption></figure>
  </div>
</main>
</body>
</html>
