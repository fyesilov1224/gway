# GWAY production stack on one server (docs/DEPLOY.md, docs/ARCHITECTURE.md §10).
# Caddy terminates https for every subdomain; the API and LiveKit are reachable only through it (LiveKit media
# also uses its own TCP/UDP ports). Supabase stays the hosted project.
name: gway

networks:
  gway:
    ipam:
      config:
        # Fixed so the API can trust Caddy's X-Forwarded-For (ReverseProxy__KnownNetworks below).
        - subnet: 172.28.0.0/16

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Cloudflare's ranges (https://www.cloudflare.com/ips, 2026-11-06); docs/ARCHITECTURE.md §3k.
      CLOUDFLARE_IPS: >-
        173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
        190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
        104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
        2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
      API_CLOUDFLARE_ONLY: ${API_CLOUDFLARE_ONLY:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www/app:/srv/app:ro
      - ./www/panel:/srv/panel:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [gway]
    depends_on: [api, livekit]

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ReverseProxy__KnownNetworks__0: 172.28.0.0/16
      Cors__AllowedOrigins__0: https://app.${DOMAIN}
      Cors__AllowedOrigins__1: https://panel.${DOMAIN}
      Billing__AppUrl: https://app.${DOMAIN}
      Billing__PublicApiUrl: https://api.${DOMAIN}
      Events__AppUrl: https://app.${DOMAIN}
      Share__AppUrl: https://app.${DOMAIN}
      LiveKit__Url: wss://livekit.${DOMAIN}
      LiveKit__ApiUrl: http://livekit:7880
      Security__Passkeys__RelyingPartyId: ${DOMAIN}
      Security__Passkeys__Origins__0: https://app.${DOMAIN}
      Security__Passkeys__Origins__1: https://panel.${DOMAIN}
      Push__CredentialsPath: /secrets/firebase-adminsdk.json
    volumes:
      - ./secrets:/secrets:ro
    networks: [gway]

  livekit:
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LiveKit__ApiKey}: ${LiveKit__ApiSecret}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    networks: [gway]

volumes:
  caddy_data:
  caddy_config:
